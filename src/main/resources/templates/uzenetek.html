<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Üzenetek')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: nav('uzenetek')}"></nav>
<header th:replace="~{fragments :: pageheader('Üzenetek')}"></header>

<main class="container py-5 flex-grow-1">
    <p class="text-center mb-4">A Kapcsolat űrlapon beérkezett üzenetek, a legfrissebb elöl.</p>

    <div th:if="${#lists.isEmpty(uzenetek)}" class="alert alert-info text-center">Még nem érkezett üzenet.</div>

    <div th:unless="${#lists.isEmpty(uzenetek)}" class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-cukor">
            <tr><th>Küldés ideje</th><th>Név</th><th>E-mail</th><th>Üzenet</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${uzenetek}">
                <td class="text-nowrap" th:text="${#temporals.format(u.kuldve, 'yyyy.MM.dd HH:mm')}">2026.11.13 12:00</td>
                <td th:text="${u.nev}">Név</td>
                <td th:text="${u.email}">email</td>
                <td th:text="${u.uzenet}" style="white-space: pre-wrap;">Üzenet</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
