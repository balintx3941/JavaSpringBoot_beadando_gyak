<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Diagram')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: nav('diagram')}"></nav>
<header th:replace="~{fragments :: pageheader('Diagram')}"></header>

<main class="container py-5 flex-grow-1">
    <p class="text-center mb-5">Diagramok a cukrászda adatbázisának adatai alapján (Chart.js).</p>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card feature-card h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Sütemények száma típus szerint</h2>
                    <canvas id="tipusDiagram" aria-label="Sütemények száma típus szerint" role="img"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card feature-card h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Mentességek eloszlása (kód szerint)</h2>
                    <canvas id="mentesDiagram" aria-label="Mentességek eloszlása" role="img"></canvas>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">

    const tipusCimkek = /*[[${tipusCimkek}]]*/ [];
    const tipusErtekek = /*[[${tipusErtekek}]]*/ [];
    const mentesCimkek = /*[[${mentesCimkek}]]*/ [];
    const mentesErtekek = /*[[${mentesErtekek}]]*/ [];

    const szinek = ['#d6336c', '#4a2c2a', '#ff9fbd', '#a0522d', '#f4c27a',
                    '#8c6bb1', '#7ccba2', '#e8a0bf', '#6b3f3a', '#ffd1dc'];

    new Chart(document.getElementById('tipusDiagram'), {
        type: 'bar',
        data: {
            labels: tipusCimkek,
            datasets: [{
                label: 'Sütemények száma',
                data: tipusErtekek,
                backgroundColor: szinek,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });

    new Chart(document.getElementById('mentesDiagram'), {
        type: 'doughnut',
        data: {
            labels: mentesCimkek,
            datasets: [{ data: mentesErtekek, backgroundColor: szinek }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } }
        }
    });
</script>
</body>
</html>
