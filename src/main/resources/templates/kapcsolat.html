<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Kapcsolat')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: nav('kapcsolat')}"></nav>
<header th:replace="~{fragments :: pageheader('Kapcsolat')}"></header>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <p class="text-center mb-4">Kérdésed van, vagy tortát szeretnél rendelni? Írj nekünk!</p>

            <div th:if="${param.sent}" class="alert alert-success">Köszönjük! Az üzeneted megérkezett hozzánk.</div>

            <form th:action="@{/kapcsolat}" th:object="${urlap}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nev" th:field="*{nev}" placeholder="Név"
                                   th:classappend="${#fields.hasErrors('nev')} ? 'is-invalid'">
                            <label for="nev">Név</label>
                            <div class="invalid-feedback" th:errors="*{nev}"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="E-mail"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <label for="email">E-mail cím</label>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <textarea class="form-control" id="uzenet" th:field="*{uzenet}" placeholder="Üzenet"
                                      style="height: 180px"
                                      th:classappend="${#fields.hasErrors('uzenet')} ? 'is-invalid'"></textarea>
                            <label for="uzenet">Üzenet</label>
                            <div class="invalid-feedback" th:errors="*{uzenet}"></div>
                        </div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary w-100 py-3" type="submit">Üzenet küldése</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
