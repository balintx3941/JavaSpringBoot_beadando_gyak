<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('CRUD')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: nav('crud')}"></nav>
<header th:replace="~{fragments :: pageheader('CRUD – Sütemények kezelése')}"></header>

<main class="container py-5 flex-grow-1">
    <div th:if="${siker}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${siker}">Siker</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezár"></button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="h4 mb-0">Sütemények (<span th:text="${#lists.size(sutik)}">0</span>)</h2>
        <a th:href="@{/crud/uj}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Új sütemény hozzáadása</a>
    </div>

    <div class="table-responsive table-scroll">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-cukor">
            <tr><th>ID</th><th>Név</th><th>Típus</th><th>Díjazott</th><th class="text-end">Műveletek</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sutik}">
                <td th:text="${s.id}">1</td>
                <td th:text="${s.nev}">Név</td>
                <td th:text="${s.tipus}">Típus</td>
                <td>
                    <span th:if="${s.dijazott}" class="badge bg-primary">Díjazott</span>
                    <span th:unless="${s.dijazott}" class="text-muted">–</span>
                </td>
                <td class="text-end text-nowrap">
                    <a th:href="@{/crud/{id}/szerkesztes(id=${s.id})}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil me-1"></i>Szerkesztés</a>
                    <form th:action="@{/crud/{id}/torles(id=${s.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Biztosan törlöd ezt a süteményt (és a hozzá tartozó tartalom- és ársorokat)?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Törlés</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
