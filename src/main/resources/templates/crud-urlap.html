<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: nav('crud')}"></nav>
<header th:replace="~{fragments :: pageheader(${title})}"></header>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <form th:action="@{${urlapAction}}" th:object="${suti}" method="post" novalidate>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nev" th:field="*{nev}" placeholder="Név"
                           th:classappend="${#fields.hasErrors('nev')} ? 'is-invalid'">
                    <label for="nev">Név</label>
                    <div class="invalid-feedback" th:errors="*{nev}"></div>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="tipus" th:field="*{tipus}" placeholder="Típus"
                           list="tipusok" autocomplete="off"
                           th:classappend="${#fields.hasErrors('tipus')} ? 'is-invalid'">
                    <label for="tipus">Típus (válassz vagy írj be újat)</label>
                    <div class="invalid-feedback" th:errors="*{tipus}"></div>
                    <datalist id="tipusok">
                        <option th:each="t : ${tipusok}" th:value="${t}"></option>
                    </datalist>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" role="switch" id="dijazott" th:field="*{dijazott}">
                    <label class="form-check-label" for="dijazott">Díjazott</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">Mentés</button>
                    <a th:href="@{/crud}" class="btn btn-outline-secondary">Mégse</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
