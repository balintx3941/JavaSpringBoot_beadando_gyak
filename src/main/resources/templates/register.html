<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Regisztráció')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: nav('register')}"></nav>
<header th:replace="~{fragments :: pageheader('Regisztráció')}"></header>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/register}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Felhasználónév" required>
                    <label for="username">Felhasználónév</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Jelszó" required minlength="4">
                    <label for="password">Jelszó (min. 4 karakter)</label>
                </div>
                <button class="btn btn-primary w-100 py-3" type="submit">Regisztráció</button>
            </form>
            <p class="text-center mt-3 mb-0">Már van fiókod? <a th:href="@{/login}">Jelentkezz be!</a></p>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
